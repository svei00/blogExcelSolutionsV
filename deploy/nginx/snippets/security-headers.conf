# Shared security headers. Included in the server block AND in every location
# that sets its own add_header - nginx replaces, rather than merges, the
# inherited add_header set as soon as a location adds one of its own.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options   "nosniff"            always;
add_header X-Frame-Options          "SAMEORIGIN"         always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
# CSP is intentionally Report-Only for now so AdSense/GA4/Firebase can be
# allowlisted without breaking the site (see api/index.js note). Tighten later.
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https:; frame-src https:;" always;
