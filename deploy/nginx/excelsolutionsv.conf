# excelsolutionsv.com - React SPA (static) + Node API reverse proxy.
# HTTP only for now; certbot --nginx will add the TLS server block and
# the 80->443 redirect. Managed as /etc/nginx/conf.d/excelsolutionsv.conf.

server {
    server_name excelsolutionsv.com www.excelsolutionsv.com;

    root /var/www/excelsolutionsv.com;
    index index.html;

    # --- Security headers (apply site-wide) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "SAMEORIGIN"         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    # CSP is intentionally Report-Only for now so AdSense/GA4/Firebase can be
    # allowlisted without breaking the site (see api/index.js note). Tighten later.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https:; frame-src https:;" always;

    # --- API -> Node backend on :3000 ---
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # --- Cache immutable hashed build assets aggressively ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Phase 11: SEO server-rendering for / and /search ---
    # These two routes are rendered by the Node app so crawlers get real
    # post links in the raw HTML. If the Node app is down, fall back to the
    # static SPA shell rather than showing a 502.
    # Header set mirrors the /api/ block above.
    location = / {
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa_static;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /search {
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa_static;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # api/index.js:69 serves the dynamic sitemap and its comment already
    # assumed nginx routed here - it didn't, so /sitemap.xml fell through
    # to the static SPA shell and Google was served index.html as
    # text/html instead of the real 18-URL sitemap (REBUILD_PLAN 5.2).
    # Deliberately NO @spa_static fallback: if the Node app is down, a
    # 502 is the honest answer - handing a crawler an HTML page labelled
    # as a sitemap is worse than briefly having none.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Post pages must reach the Node app, not the static SPA shell.
    # api/middleware/injectMeta.js owns /post/:slug: it injects the
    # per-post <title>, meta description, OG tags and JSON-LD
    # (REBUILD_PLAN 5.1/5.3), and - the reason this block was added -
    # it 301s an old slug found in slugAliases to the post's current
    # slug (11.C.2). Served statically, both were silently dead: every
    # post page returned the generic site-wide title, and a migrated
    # slug would 200-render the SPA's not-found state instead of
    # redirecting. Prefix match beats `location /` regardless of order.
    location /post/ {
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa_static;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static SPA shell, used only when the Node app returns 5xx above.
    location @spa_static {
        root /var/www/blogExcelSolutionsV/client/dist;
        try_files /index.html =404;
    }

    # Legacy WordPress URL still in the index; send it to the homepage.
    location = /index.php {
        return 301 /;
    }

    # --- SPA fallback: every other path serves index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't serve dotfiles (.git, .env leaked into web root, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # rollup-plugin-visualizer writes dist/stats.html (full bundle/module
    # map). The deploy rsyncs all of dist/, so block it here as defense in
    # depth even if a future build re-publishes it.
    location = /stats.html {
        return 404;
    }

    client_max_body_size 12M;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/excelsolutionsv.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/excelsolutionsv.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.excelsolutionsv.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = excelsolutionsv.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name excelsolutionsv.com www.excelsolutionsv.com;
    return 404; # managed by Certbot




}
